<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>토론 화면 연결 확인 | WHAT IF</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172554;background:#f8fafc;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0}
    header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px max(20px,calc((100vw - 1120px)/2));background:#fff;border-bottom:1px solid #dbe3ef}.brand{font-size:20px;font-weight:800;color:#101e54;text-decoration:none}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav a,.nav button{border:1px solid #d7dfeb;border-radius:9px;background:#fff;color:#172554;padding:8px 12px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}
    main{max-width:1120px;margin:34px auto;padding:0 20px}.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:800;color:#648043}.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}.title-row h1{margin:5px 0 7px;font-size:29px}.muted{color:#64748b;line-height:1.55}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:23px 0 12px}.controls select{min-width:min(420px,78vw);padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#172554;font:inherit}.controls button{padding:10px 14px;border:0;border-radius:9px;background:#a3e635;color:#172554;font:inherit;font-weight:750;cursor:pointer}.connection{display:flex;gap:9px;flex-wrap:wrap;margin:16px 0}.chip{padding:7px 10px;border-radius:99px;background:#e8edf4;color:#536179;font-size:12px;font-weight:750}.chip.ok{background:#eaf7dc;color:#477615}.chip.bad{background:#fff0e8;color:#a4471d}.card{padding:17px;border:1px solid #dce4ef;border-radius:13px;background:#fff;margin-top:15px}.card h2{font-size:16px;margin:0 0 12px}.meta{color:#64748b;font-size:13px}.empty,.error{padding:22px;border:1px solid #dce4ef;border-radius:12px;background:#fff;color:#64748b}.error{color:#9a3412;border-color:#f0c6b5}.events{display:grid;gap:10px;max-height:58vh;overflow:auto}.event{border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;background:#fff}.event-head{display:flex;justify-content:space-between;gap:12px;padding:10px 12px;background:#f8fafc;font-size:12px}.event-type{font-weight:800;color:#315ca8}.event pre{margin:0;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,SFMono-Regular,monospace;color:#334155}.notice{font-size:13px;margin-top:14px;color:#64748b}
    @media(max-width:600px){header{align-items:flex-start;flex-direction:column}.title-row h1{font-size:24px}main{margin-top:24px}}
  </style>
</head>
<body>
  <header>
    <a class="brand" href="/quote-monitor">WHAT IF</a>
    <nav class="nav" aria-label="페이지 이동">
      <a href="/quote-monitor">실시간 데이터</a>
      <a href="/news-monitor">뉴스 확인</a>
      <a href="/holdings.html">내 보유 종목</a>
      <button id="reload" type="button">토론 목록 새로고침</button>
    </nav>
  </header>
  <main>
    <section class="title-row">
      <div><div class="eyebrow">TEMPORARY CONNECTION CHECK</div><h1>토론 화면 연결 확인</h1><p class="muted">기존 토론을 선택해 이벤트 API와 실시간 WebSocket 연결을 확인합니다.</p></div>
    </section>
    <div class="controls">
      <label for="debate-select">내 토론</label>
      <select id="debate-select"><option value="">토론 목록 불러오는 중</option></select>
      <button id="connect" type="button">선택한 토론 연결</button>
    </div>
    <div class="connection" aria-live="polite">
      <span id="api-state" class="chip">API 대기</span>
      <span id="socket-state" class="chip">WebSocket 대기</span>
      <span id="debate-state" class="chip">토론 미선택</span>
    </div>
    <section class="card">
      <h2>토론 상태</h2>
      <div id="status-detail" class="meta">토론을 선택하고 연결 버튼을 눌러 주세요.</div>
    </section>
    <section class="card">
      <h2>토론 이벤트 <span id="event-count" class="meta">0</span></h2>
      <div id="events" class="events"><div class="empty">선택한 토론의 이벤트가 여기에 표시됩니다.</div></div>
    </section>
    <p class="notice">이 임시 화면은 토론을 새로 시작하지 않습니다. 토론이 아직 없다면 기존 분석 화면에서 토론을 시작한 뒤 이 페이지에서 선택하세요.</p>
  </main>
  <script src="/debate-monitor.js" defer></script>
</body>
</html>
