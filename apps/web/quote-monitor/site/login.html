<body class="service-login-page rm-login">
  <canvas class="rm-rain" aria-hidden="true"></canvas>

    <header class="rm-titlebar">
      <span class="rm-titlebar-icon" aria-hidden="true"></span>
      <span>WHAT IF — 로그인</span>
    </header>
    <div class="rm-window-body">
      <p class="rm-eyebrow">TIME INVESTOR · 2008</p>
      <h1 id="login-title">만약 시장이<br>흔들린다면?</h1>
      <p class="rm-lede">금리·환율·유가·VIX 충격을 가정하고, 내 종목과 보유 자산이 5거래일 뒤 어떻게 반응할지 미리 확인하세요.</p>
      <ul class="rm-features">
        <li><b>01</b><span>충격 조건 설정 → 종목별 90% 결과 범위</span></li>
        <li><b>02</b><span>내 포트폴리오 손익 영향 확인</span></li>
        <li><b>03</b><span>AI 에이전트와 뉴스·공시 근거로 토론</span></li>
      </ul>

        <span class="rm-prompt" aria-hidden="true">C:\WHATIF&gt;</span>
        <span class="rm-typed" aria-hidden="true"></span><span class="rm-caret" aria-hidden="true"></span>
        <p id="login-status" class="rm-sr" role="status">로그인 상태를 확인하는 중입니다.</p>

    </div>
