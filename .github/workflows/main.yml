name: Deploy StressLab to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/quote-monitor/index.html"
      - "apps/web/quote-monitor/monitor.js"
      - "apps/web/quote-monitor/market-state.js"
      - "apps/web/quote-monitor/holdings.html"
      - "apps/web/quote-monitor/holdings.js"
      - "apps/web/quote-monitor/login.html"
      - "apps/web/quote-monitor/stress.html"
      - "apps/web/quote-monitor/stress.js"
      - "apps/web/quote-monitor/staticwebapp.config.json"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stresslab-swa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare only approved deployment files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="apps/web/quote-monitor"
          OUTPUT="deploy-output"
          mkdir -p "$OUTPUT"

          for file in \
            index.html \
            monitor.js \
            market-state.js \
            holdings.html \
            holdings.js \
            login.html \
            stress.html \
            stress.js \
            staticwebapp.config.json
          do
            test -s "$SOURCE/$file"
            cp "$SOURCE/$file" "$OUTPUT/$file"
          done

          echo "Approved deployment files:"
          find "$OUTPUT" -type f | sort

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy-output
          api_location: ""
          output_location: ""
          skip_app_build: true
