name: Deploy StressLab to Azure Static Web Apps

on:
  push:
    branches:
      - main
    paths:
      - "apps/web/quote-monitor/**"
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stresslab-swa-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare public site files
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="apps/web/quote-monitor/site"
          OUTPUT="deploy-output"
          mkdir -p "$OUTPUT"

          # Include present and future public website assets (including subfolders).
          # Exclude scripts, dotfiles, source maps, and potential credentials.
          rsync -a --prune-empty-dirs \
            --exclude='.*' \
            --exclude='node_modules/' \
            --exclude='__pycache__/' \
            --exclude='*.map' \
            --exclude='*secret*' \
            --exclude='*credential*' \
            --exclude='*token*' \
            --exclude='*.pem' \
            --exclude='*.key' \
            --include='*/' \
            --include='*.html' \
            --include='*.htm' \
            --include='*.js' \
            --include='*.mjs' \
            --include='*.css' \
            --include='*.json' \
            --include='*.webmanifest' \
            --include='*.svg' \
            --include='*.png' \
            --include='*.jpg' \
            --include='*.jpeg' \
            --include='*.gif' \
            --include='*.webp' \
            --include='*.avif' \
            --include='*.ico' \
            --include='*.woff' \
            --include='*.woff2' \
            --include='*.ttf' \
            --include='*.otf' \
            --include='*.txt' \
            --include='*.xml' \
            --include='*.wasm' \
            --include='*.pdf' \
            --include='*.mp4' \
            --include='*.webm' \
            --include='*.mp3' \
            --include='*.ogg' \
            --exclude='*' \
            "$SOURCE/" "$OUTPUT/"

          test -s "$OUTPUT/index.html"
          test -s "$OUTPUT/staticwebapp.config.json"
          test -s "$OUTPUT/login.html"
          test -s "$OUTPUT/2_intro/index.html"
          test -s "$OUTPUT/quote-monitor/index.html"
          test -s "$OUTPUT/whatif-agent.html"

          echo "Deployment files:"
          find "$OUTPUT" -type f | sort

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy-output
          api_location: ""
          output_location: ""
          skip_app_build: true
